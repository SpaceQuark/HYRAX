[project]
name = "hyrax-gpu"
version = "0.2.0"
description = "HYRAX node agent (hyrax-bask) and CLI (hyrax)"
requires-python = ">=3.10"
dependencies = ["nvidia-ml-py>=12"]

[project.scripts]
hyrax = "hyrax.cli:main"
hyrax-bask = "hyrax.bask:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hyrax"]
