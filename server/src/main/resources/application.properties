server.port=7070
# Lets the CLI show why a request was refused.
server.error.include-message=always

spring.datasource.url=jdbc:postgresql://localhost:5432/hyrax
spring.datasource.username=hyrax
spring.datasource.password=${HYRAX_DB_PASSWORD:}

# How long one-minute telemetry rollups are kept.
hyrax.sample-retention=30d

# A node is shown offline once its last heartbeat is older than this.
hyrax.node-timeout=10s

# Nodes whose GPUs are never scheduled and never scream, comma-separated: for example the machine
# that hosts the control plane, or one kept for private work.
hyrax.reserved-nodes=${HYRAX_RESERVED_NODES:}

# TLS. Jobs are only accepted, and only handed to agents, over HTTPS.
server.ssl.enabled=${HYRAX_TLS:false}
server.ssl.certificate=${HYRAX_TLS_CERT:}
server.ssl.certificate-private-key=${HYRAX_TLS_KEY:}

# Shared secret that lets a node that is not enrolled yet report telemetry. It never gets a node
# any work: that needs the node's own token (hyrax admin enroll). Empty means such nodes are not checked.
hyrax.agent-token=${HYRAX_AGENT_TOKEN:}

# When the user table is empty, create this admin and write its API token to the file below.
hyrax.bootstrap.admin=${HYRAX_BOOTSTRAP_ADMIN:}
hyrax.bootstrap.token-file=${user.home}/.config/hyrax/bootstrap-admin.token

# Scheduler.
hyrax.jobs.tick=3s
# An agent must report an assigned attempt within this time or the job is queued again.
hyrax.jobs.assign-lease=30s
# A running job is marked LOST once its node has been silent this long.
hyrax.jobs.lost-after=60s
# A GPU is free when compute processes hold at most this much memory, and have for this long.
hyrax.jobs.free-max-compute-mb=500
hyrax.jobs.free-for=30s
hyrax.jobs.max-log-bytes=67108864

# Basking: a compute process holding at least min-memory-mb while its GPU stays at or below
# max-utilization percent. The dashboard shows it after basking-after; an alert opens after alert-after.
hyrax.idle.max-utilization=5
hyrax.idle.min-memory-mb=1024
hyrax.idle.basking-after=10m
hyrax.idle.alert-after=2h

# Slack. Without a bot token alerts are recorded but nobody is pinged.
hyrax.slack.bot-token=${SLACK_BOT_TOKEN:}
hyrax.slack.app-token=${SLACK_APP_TOKEN:}
# Channel ID that alerts for unowned processes go to. The bot must be a member.
hyrax.slack.lab-channel=${HYRAX_SLACK_LAB_CHANNEL:}
hyrax.slack.snooze=2h

# Source snapshots and job outputs are files under this directory.
hyrax.data-dir=${user.home}/.local/share/hyrax/server
hyrax.snapshots.max-bytes=209715200
# Total output a single job attempt may upload.
hyrax.artifacts.max-bytes=21474836480
