server.port=7070

spring.datasource.url=jdbc:postgresql://localhost:5432/hyrax
spring.datasource.username=hyrax
spring.datasource.password=${HYRAX_DB_PASSWORD:}

# How long one-minute telemetry rollups are kept.
hyrax.sample-retention=30d

# A node is shown offline once its last heartbeat is older than this.
hyrax.node-timeout=10s

# Shared secret agents send as a bearer token. Empty means agents are not checked.
hyrax.agent-token=${HYRAX_AGENT_TOKEN:}

# Basking: a compute process holding at least min-memory-mb while its GPU stays at or below
# max-utilization percent. The dashboard shows it after basking-after; an alert opens after alert-after.
hyrax.idle.max-utilization=5
hyrax.idle.min-memory-mb=1024
hyrax.idle.basking-after=10m
hyrax.idle.alert-after=2h

# Slack. Without a bot token alerts are recorded but nobody is pinged.
hyrax.slack.bot-token=${SLACK_BOT_TOKEN:}
hyrax.slack.app-token=${SLACK_APP_TOKEN:}
# Channel ID that alerts for unowned processes go to. The bot must be a member.
hyrax.slack.lab-channel=${HYRAX_SLACK_LAB_CHANNEL:}
hyrax.slack.snooze=2h
